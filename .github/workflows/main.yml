name: Build Gauguin Kernel (AOSPA Topaz + Custom Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (存放 .config 和 patches)
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex libssl-dev bc libncurses-dev \
            build-essential libelf-dev rsync ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gauguin-aospa-${{ github.run_id }}
          restore-keys: |
            ccache-gauguin-aospa-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache -z

      # 1. 切换为正确的 AOSPA 仓库和 Android 13 对应的 topaz 分支
      - name: Checkout kernel source (AOSPA, topaz branch)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch topaz \
            https://github.com/aospa-gauguin/kernel_xiaomi_gauguin.git kernel

      # 2. 切换为提取信息中显示的 Proton Clang，以确保100%环境兼容
      - name: Download Proton Clang 11 toolchain
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          toolchain/proton-clang/bin/clang --version

      - name: Fix python2 syntax in scripts/gcc-wrapper.py
        run: |
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i \
              -e 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' \
              -e "s/print line,/print(line, end='')/" \
              -e "s/print args\[0\] + ':',e.strerror/print(args[0] + ':', e.strerror)/" \
              -e "s/print 'Is your PATH set correctly?'/print('Is your PATH set correctly?')/" \
              -e "s/print ' '.join(args), str(e)/print(' '.join(args), str(e))/" \
              -e '1s/python2/python3/' \
              scripts/gcc-wrapper.py
          fi

      # 修正编译链前缀，适配 Proton Clang 路径
      - name: Fix GCC_TOOLCHAIN_DIR prefix for Clang cross compilation
        run: |
          cd kernel
          sed -i 's|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))|' Makefile

      - name: Simplify LINUX_COMPILER string in scripts/mkcompile_h
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "scripts/mkcompile_h"
          with open(path) as f:
              content = f.read()
          old = '''echo \\#define LINUX_COMPILER \\"`$CC -v 2>&1 | grep ' version ' | sed 's/[[:space:]]*$//'`\\"'''
          new = 'echo \\#define LINUX_COMPILER \\"GNU C\\"'
          if old in content:
              content = content.replace(old, new, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("LINUX_COMPILER 已改成固定字符串")
          EOF

      # KernelSU 模块集成
      - name: Integrate original KernelSU v0.9.5
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      # 如果你在 workflow-repo 放了 KernelSU 补丁，会在这里应用
      - name: Apply KernelSU manual hook patches
        run: |
          cd kernel
          if [ -d "../workflow-repo/patches" ] && [ "$(ls -A ../workflow-repo/patches/*.patch 2>/dev/null)" ]; then
            for p in ../workflow-repo/patches/*.patch; do
              echo "applying $p"
              patch -p1 < "$p" || true
            done
          fi

      # 3. 核心步骤：直接注入你提取的完整配置，不再使用 defconfig
      - name: Inject Custom Extracted .config
        run: |
          cd kernel
          mkdir -p out
          # 将你在仓库根目录放置的 gauguin_kernel_config.txt 复制为编译所需的 .config
          cp ../workflow-repo/gauguin_kernel_config.txt out/.config
          
          # 追加一些必要参数 (KSU和版本精简)
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_LOCALVERSION_AUTO=n"
          } >> out/.config

          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          # 使用 olddefconfig 命令让新源码树自动接纳并平滑升级老配置
          make O=out ARCH=arm64 PYTHON=python3 CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

      # 4. 采用 Proton Clang 进行编译
      - name: Build kernel Image and dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          export KBUILD_BUILD_USER=aospa
          export KBUILD_BUILD_HOST=archlinux
          
          # 编译 Image
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            Image 2>&1 | tee build.log
            
          # 编译 dtb
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            vendor/qcom/gauguin-sm6350.dtb 2>&1 | tee -a build.log
          ccache -s

      - name: Concatenate Image + dtb manually
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          DTB="$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb"
          if [ -f "$BOOT_OUT/Image" ] && [ -f "$DTB" ]; then
            cat "$BOOT_OUT/Image" "$DTB" > "$BOOT_OUT/Image-dtb"
            echo "拼接完成"
          fi

      - name: Checkout AnyKernel3 template
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/ramdisk ak3/patch ak3/.git

      - name: Write anykernel.sh
        run: |
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script for gauguin
          properties() { '
          kernel.string=AOSPA Topaz Kernel for Gauguin
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          supported.versions=
          supported.patchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

      - name: Package AnyKernel3 flashable zip
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          if [ -f "$BOOT_OUT/Image-dtb" ]; then
            cp "$BOOT_OUT/Image-dtb" ak3/Image
          elif [ -f "$BOOT_OUT/Image" ]; then
            cp "$BOOT_OUT/Image" ak3/Image
            cp "$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb" ak3/dtb 2>/dev/null || true
          fi
          cd ak3
          zip -r9 ../gauguin-kernel-KSU-AK3.zip . -x ".git*"

      - name: Upload AK3 zip + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-kernel-AOSPA-Topaz
          path: |
            gauguin-kernel-KSU-AK3.zip
            kernel/build.log
          if-no-files-found: warn

name: Build Gauguin Kernel (DtHnAme, A13-config + ReSukiSU + SuSFS + KPM)

# 源码: DtHnAme/kernel_xiaomi_gauguin, 11-1分支 (SUBLEVEL 113)
#
# 状态：源码+A13差异config+ReSukiSU manual hook这个组合已经实机确认能
# 正常开机(内核版本显示4.19.113-perf-gccb8855-dirty，manager正常识别驱动)。
#
# 这版加了SuSFS和KPM，参考的是JackA1ltman/NonGKI_Kernel_Build_2nd项目
# (看雪那篇Pixel3 4.9指南也是抄这个项目的思路)。SuSFS没有直接抄文档，
# 是把它仓库里 susfs_patch_to_4.19.patch 拉下来、克隆了一份完整的
# DtHnAme真实源码(含前面ReSukiSU那4个hook)本地实测过：19个文件里18个
# 完全干净应用，只有fs/notify/fdinfo.c 1个hunk因为DtHnAme这版
# seq_printf用的是ignored_mask:%x实际变量、上游patch期望ignored_mask:0
# 字面量对不上失败，已经照着DtHnAme真实代码结构手动补好，跟原patch
# 效果等价，这个修补是自动应用的，不需要你自己动手。
#
# KPM：编译出来的Image还得额外用SukiSU_patch仓库的patch_linux工具处理
# 一遍才真正生效——之前提过这个坑，这版已经在打包前自动加了这一步。
#
# 如果manager里SUSFS或KPM还是没显示生效，大概率是这两个特性本身在
# 更新，跟这版verify过的细节对不上了，把manager截图发我对着改。
#
# config差异来源：对比DtHnAme原版defconfig 和 手机上
# `zcat /proc/config.gz` 提取出的当前A13内核完整config，
# 703/734项完全一致，只有23项不同——这些差异追加在下面
# "Apply A13-diff defconfig fragment"这一步里，配置层面尽量向
# 当前能跑的A13环境靠拢，源码本身不动。
#
# 这版额外加了Aquarius223分享的抓日志方法（已对照本仓库真实源码核对
# 过行号）：强制所有重启路径落到recovery，并把kmsg_dump提前到重启函数
# 最前面，这样哪怕开机3秒就重启/秒进fastboot，也能在rec里读到
# /proc/last_kmsg 或 /sys/fs/pstore/console-ramoops-0 拿到早期崩溃日志。
#
# 这版之后再考虑：
#   1. 装好之后到ReSukiSU manager里确认KPM状态是不是真的生效了，不是
#      光看编译成功
#   2. susfs——按上面说的，单独开一轮，先搞清楚要不要在ReSukiSU manual
#      hook代码基础上手动合susfs4ksu的patch，还是有其他更省事的路子
#   3. 版本字符串精简（这次故意没做，保留完整git hash/编译器信息，
#      方便跟手机上 `cat /proc/version` 的输出直接对比调试）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex libssl-dev bc libncurses-dev \
            build-essential libelf-dev rsync ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gauguin-dthname-a13test-${{ github.run_id }}
          restore-keys: |
            ccache-gauguin-dthname-a13test-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache -z

      - name: Checkout kernel source (DtHnAme, 11-1 branch, matches 4.19.113)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch 11-1 \
            https://github.com/DtHnAme/kernel_xiaomi_gauguin.git kernel

      - name: Download AOSP Clang r416183b toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang11
          toolchain/clang11/bin/clang --version

      - name: Download matching AOSP GCC 4.9 toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/gcc49

      - name: Fix python2 syntax in scripts/gcc-wrapper.py
        run: |
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i \
              -e 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' \
              -e "s/print line,/print(line, end='')/" \
              -e "s/print args\[0\] + ':',e.strerror/print(args[0] + ':', e.strerror)/" \
              -e "s/print 'Is your PATH set correctly?'/print('Is your PATH set correctly?')/" \
              -e "s/print ' '.join(args), str(e)/print(' '.join(args), str(e))/" \
              -e '1s/python2/python3/' \
              scripts/gcc-wrapper.py
          fi

      - name: Fix GCC_TOOLCHAIN_DIR prefix for Clang cross compilation
        run: |
          cd kernel
          sed -i 's|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))|' Makefile

      - name: Fix GSI symbol CRC versioning for lld compatibility
        run: |
          cd kernel
          if grep -q "if (is_crc) {" scripts/mod/modpost.c; then
            sed -i 's/if (is_crc) {/if (is_crc \&\& strcmp(symname + strlen("__crc_"), "gsi_write_channel_scratch")) {/' scripts/mod/modpost.c
          fi

      - name: Implement stpcpy for Clang 12 libcall optimization (if missing)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "lib/string.c"
          with open(path) as f:
              content = f.read()
          if "char *stpcpy" in content:
              print("stpcpy已经存在，跳过")
          else:
              stub = ("char *stpcpy(char *__restrict__ dest, const char *__restrict__ src);\n"
                      "char *stpcpy(char *__restrict__ dest, const char *__restrict__ src)\n"
                      "{\n"
                      "\twhile ((*dest++ = *src++) != '\\0')\n"
                      "\t\t/* nothing */;\n"
                      "\treturn --dest;\n"
                      "}\n"
                      "EXPORT_SYMBOL(stpcpy);\n"
                      "\n")
              anchor = "#ifndef __HAVE_ARCH_STRCAT"
              assert anchor in content, "anchor not found, need manual check"
              content = content.replace(anchor, stub + anchor, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("stpcpy inserted")
          EOF

      - name: Fix duplicate disp_rdump_memory label in xiaomi-sm6350-common.dtsi
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "arch/arm64/boot/dts/vendor/qcom/xiaomi-sm6350-common.dtsi"
          with open(path) as f:
              content = f.read()
          anchor = "&reserved_memory {\n\tdisp_rdump_memory: disp_rdump_region@ac000000 {"
          if anchor not in content:
              raise SystemExit("anchor not found, need manual check")
          if "/delete-node/ &disp_rdump_memory;" in content:
              print("已经修过，跳过")
          else:
              content = content.replace(anchor, "/delete-node/ &disp_rdump_memory;\n\n" + anchor, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("duplicate label 修复完成")
          EOF

      # 来自Aquarius223分享的抓日志方法——这版已确认能正常开机(gccb8855)，
      # 暂时不需要了，先移除。如果后面加KPM/susfs又出问题，这两个patch
      # 随时能加回来，之前验证过的代码就在上一版main.yml里。

      # ReSukiSU集成，全部对照DtHnAme 11-1真实源码核对过锚点，本地跑过
      # str_replace校验才放进来的，不是照抄文档里的通用diff。
      # 4.19.113用不上kprobe(A13跑的内核和DtHnAme defconfig都没开
      # CONFIG_KPROBES)，走manual hook这条路，跟你们上次A11+KSU成功那次
      # 应该是同一套思路。
      - name: Add ReSukiSU to kernel source tree
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: ReSukiSU manual hook - fs/stat.c (Required)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/stat.c"
          with open(path) as f:
              content = f.read()
          if "CONFIG_KSU_MANUAL_HOOK" in content and "ksu_handle_stat" in content:
              print("已经打过，跳过"); raise SystemExit(0)

          anchor1 = ("#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
                     "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
                     "\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n"
                     "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          assert anchor1 in content, "anchor1 (newfstatat) not found, check this source tree manually"
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *flags);\n"
                  "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
                  "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
                  "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n"
                  "#endif\n#endif\n\n")
          new1 = anchor1.replace(
              "\tint error;\n\n\terror = vfs_fstatat",
              "\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat"
          )
          content = content.replace(anchor1, decl + new1, 1)

          anchor2 = ('SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n'
                     '\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n'
                     '\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\n\treturn error;')
          assert anchor2 in content, "anchor2 (newfstat) not found"
          content = content.replace(anchor2, anchor2.replace(
              "\treturn error;",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\treturn error;"), 1)

          anchor3 = ('SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\n{\n'
                     '\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n'
                     '\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n\n\treturn error;')
          assert anchor3 in content, "anchor3 (fstat64) not found"
          content = content.replace(anchor3, anchor3.replace(
              "\treturn error;",
              "#ifdef CONFIG_KSU_MANUAL_HOOK // for 32-bit\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n\treturn error;"), 1)

          anchor4 = ("SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
                     "\t\tstruct stat64 __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n"
                     "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          assert anchor4 in content, "anchor4 (fstatat64) not found"
          content = content.replace(anchor4, anchor4.replace(
              "\tint error;\n\n\terror = vfs_fstatat",
              "\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK // 32-bit su\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat"), 1)

          with open(path, "w") as f:
              f.write(content)
          print("fs/stat.c hook完成")
          EOF

      - name: ReSukiSU manual hook - fs/exec.c (Required)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/exec.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_execveat" in content:
              print("已经打过，跳过"); raise SystemExit(0)

          anchor1 = ('int do_execve(struct filename *filename,\n'
                     '\tconst char __user *const __user *__argv,\n'
                     '\tconst char __user *const __user *__envp)\n{\n'
                     '\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n'
                     '\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n'
                     '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}')
          assert anchor1 in content, "anchor1 (do_execve) not found, check this source tree manually"
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif\n\n")
          new1 = anchor1.replace(
              "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}",
              "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n"
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}"
          )
          content = content.replace(anchor1, decl + new1, 1)

          anchor2 = ('static int compat_do_execve(struct filename *filename,\n'
                     '\tconst compat_uptr_t __user *__argv,\n\tconst compat_uptr_t __user *__envp)\n{\n'
                     '\tstruct user_arg_ptr argv = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __argv,\n\t};\n'
                     '\tstruct user_arg_ptr envp = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __envp,\n\t};\n'
                     '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}')
          assert anchor2 in content, "anchor2 (compat_do_execve) not found"
          content = content.replace(anchor2, anchor2.replace(
              "\t};\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}",
              "\t};\n#ifdef CONFIG_KSU_MANUAL_HOOK // 32-bit ksud and 32-on-64 support\n"
              "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n"
              "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}"), 1)

          with open(path, "w") as f:
              f.write(content)
          print("fs/exec.c hook完成")
          EOF

      - name: ReSukiSU manual hook - fs/open.c (Required)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/open.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_faccessat" in content:
              print("已经打过，跳过"); raise SystemExit(0)
          anchor = "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\treturn do_faccessat(dfd, filename, mode);\n}"
          assert anchor in content, "anchor (faccessat) not found, check this source tree manually"
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n#endif\n\n")
          new = ("SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n"
                 "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"
                 "\treturn do_faccessat(dfd, filename, mode);\n}")
          content = content.replace(anchor, decl + new, 1)
          with open(path, "w") as f:
              f.write(content)
          print("fs/open.c hook完成")
          EOF

      - name: ReSukiSU manual hook - kernel/reboot.c sys_reboot (Required)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "kernel/reboot.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_sys_reboot" in content:
              print("已经打过，跳过"); raise SystemExit(0)
          anchor = ("SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
                    "\t\tvoid __user *, arg)\n{\n"
                    "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
                    "\tchar buffer[256];\n\tint ret = 0;\n\n"
                    "\t/* We only trust the superuser with rebooting the system. */")
          assert anchor in content, "anchor (SYSCALL_DEFINE4 reboot) not found, check this source tree manually"
          decl = "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
          new = anchor.replace(
              "\tint ret = 0;\n\n\t/* We only trust",
              "\tint ret = 0;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\n\t/* We only trust"
          )
          content = content.replace(anchor, decl + new, 1)
          with open(path, "w") as f:
              f.write(content)
          print("kernel/reboot.c sys_reboot hook完成")
          EOF

      # SuSFS——用的是NonGKI_Kernel_Build_2nd项目里现成的susfs_patch_to_4.19.patch，
      # 不是从头写的。已经在本地对着DtHnAme真实源码(含前面4个ReSukiSU hook)
      # 完整测试过：19个文件里18个完全干净应用，只有fs/notify/fdinfo.c 1个
      # hunk因为DtHnAme这版seq_printf用的是ignored_mask:%x实际变量、上游patch
      # 期望的是ignored_mask:0字面量，上下文对不上失败——已经手动照着DtHnAme
      # 真实代码结构补好，跟原patch效果等价，下面这步会自动应用。
      - name: Apply SuSFS patch (base + verified manual fix for fdinfo.c)
        run: |
          cd kernel
          curl -sL -o susfs_patch_to_4.19.patch \
            "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch"
          patch -p1 < susfs_patch_to_4.19.patch || true

          python3 - << 'EOF'
          path = "fs/notify/fdinfo.c"
          with open(path) as f:
              content = f.read()
          if "CONFIG_KSU_SUSFS_SUS_MOUNT" in content and "susfs_is_current_proc_umounted" in content:
              print("fdinfo.c 已经手动修好，跳过")
          else:
              anchor = ("static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n"
                        "{\n\tstruct inotify_inode_mark *inode_mark;\n\tstruct inode *inode;\n\n"
                        "\tif (mark->connector->type != FSNOTIFY_OBJ_TYPE_INODE)\n\t\treturn;\n\n"
                        "\tinode_mark = container_of(mark, struct inotify_inode_mark, fsn_mark);\n"
                        "\tinode = igrab(fsnotify_conn_inode(mark->connector));\n\tif (inode) {\n")
              assert anchor in content, "anchor not found -- fs/notify/fdinfo.c structure changed, check manually"
              new = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n"
                     "#else\nstatic void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n#endif\n"
                     "{\n\tstruct inotify_inode_mark *inode_mark;\n\tstruct inode *inode;\n"
                     "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tstruct mount *mnt = NULL;\n#endif\n\n"
                     "\tif (mark->connector->type != FSNOTIFY_OBJ_TYPE_INODE)\n\t\treturn;\n\n"
                     "\tinode_mark = container_of(mark, struct inotify_inode_mark, fsn_mark);\n"
                     "\tinode = igrab(fsnotify_conn_inode(mark->connector));\n\tif (inode) {\n")
              content = content.replace(anchor, new, 1)

              anchor2 = ('\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n'
                         '\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",\n'
                         '\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n'
                         '\t\t\t   mask, mark->ignored_mask);\n'
                         '\t\tshow_mark_fhandle(m, inode);\n'
                         '\t\tseq_putc(m, \'\\n\');\n\t\tiput(inode);\n\t}\n}')
              assert anchor2 in content, "anchor2 not found -- fs/notify/fdinfo.c structure changed, check manually"
              susfs_block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t\tmnt = real_mount(file->f_path.mnt);\n"
                  "\t\tif (mnt->mnt_id >= DEFAULT_KSU_MNT_ID &&\n"
                  "\t\t\tlikely(susfs_is_current_proc_umounted()))\n\t\t{\n"
                  "\t\t\tstruct path path;\n"
                  "\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
                  "\t\t\tchar *dpath;\n"
                  "\t\t\tif (!pathname) {\n\t\t\t\tgoto orig_flow;\n\t\t\t}\n"
                  "\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n"
                  "\t\t\tif (!dpath) {\n\t\t\t\tgoto out_kfree;\n\t\t\t}\n"
                  "\t\t\tif (kern_path(dpath, 0, &path)) {\n\t\t\t\tgoto out_kfree;\n\t\t\t}\n"
                  "\t\t\tif (!path.dentry->d_inode) {\n\t\t\t\tgoto out_path_put;\n\t\t\t}\n"
                  "\t\t\tseq_printf(m, \"inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 \",\n"
                  "\t\t\t\t\tinode_mark->wd, path.dentry->d_inode->i_ino, path.dentry->d_inode->i_sb->s_dev,\n"
                  "\t\t\t\t\tinotify_mark_user_mask(mark));\n"
                  "\t\t\tshow_mark_fhandle(m, path.dentry->d_inode);\n"
                  "\t\t\tseq_putc(m, '\\n');\n\t\t\tpath_put(&path);\n\t\t\tkfree(pathname);\n"
                  "\t\t\tiput(inode);\n\t\t\treturn;\n"
                  "out_path_put:\n\t\t\tpath_put(&path);\n"
                  "out_kfree:\n\t\t\tkfree(pathname);\n\t\t}\norig_flow:\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              )
              new2 = ('\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n' + susfs_block +
                      '\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",\n'
                      '\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n'
                      '\t\t\t   mask, mark->ignored_mask);\n'
                      '\t\tshow_mark_fhandle(m, inode);\n'
                      '\t\tseq_putc(m, \'\\n\');\n\t\tiput(inode);\n\t}\n}')
              content = content.replace(anchor2, new2, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("fs/notify/fdinfo.c 手动修补完成")
          EOF

          echo "--- 检查还有没有没解决的.rej文件，有的话直接报错，别悄悄漏掉 ---"
          REMAINING=$(find . -name "*.rej")
          if [ -n "$REMAINING" ]; then
            echo "发现未处理的.rej文件："
            echo "$REMAINING"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi
          find . -type f \( -name "*.rej" -o -name "*.orig" \) -delete
          echo "SuSFS patch全部应用完成，没有遗留冲突"


      # AUTO_*_HOOK这几个Kconfig开关就够了(见下面defconfig fragment)。
      # CONFIG_KALLSYMS_ALL=y前面A13-diff那23条里已经有了，所以
      # security/selinux/*.c那5处static符号导出也可以跳过，不用再改。

      # 23条差异逐条来源见上面顶部注释；优先级最高的3条(PANIC_ON_OOPS/
      # RT_GROUP_SCHED/MSM_PERFORMANCE)最可能跟"震动后不到开机画面就
      # 重启"直接相关。SERIAL_MSM_GENI_CONSOLE故意不跟A13对齐——保留
      # UART console输出，纯粹是诊断手段，不影响能不能开机。
      - name: Apply A13-diff defconfig fragment + ReSukiSU config
        run: |
          cd kernel
          {
            echo "# --- ReSukiSU (manual hook, confirmed booting on A13 as gccb8855) ---"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"
            echo "# KPM: CONFIG_KALLSYMS_ALL/CONFIG_KALLSYMS already satisfied elsewhere;"
            echo "# 4.19.113 is not below 4.19 so no set_memory.h backport needed."
            echo "CONFIG_KPM=y"
            echo ""
            echo "# --- SuSFS (base patch verified against real source, see step above) ---"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "CONFIG_SUSFS_EXTRA_WORKS=y"
            echo ""
            echo "# --- A13 config diff overrides, top suspects for boot failure ---"
            echo "# CONFIG_PANIC_ON_OOPS is not set"
            echo "# CONFIG_RT_GROUP_SCHED is not set"
            echo "# CONFIG_MSM_PERFORMANCE is not set"
            echo ""
            echo "# --- remaining A13 diffs, lower priority (debug/logging/misc) ---"
            echo "CONFIG_LOG_BUF_SHIFT=17"
            echo "CONFIG_RD_BZIP2=y"
            echo "CONFIG_RD_LZMA=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "# CONFIG_HARDEN_BRANCH_PREDICTOR is not set"
            echo "# CONFIG_GPIO_TESTING_MODE is not set"
            echo "# CONFIG_SCSI_UFSHCD_CMD_LOGGING is not set"
            echo "# CONFIG_XLOGCHAR is not set"
            echo "CONFIG_LOGO=y"
            echo "CONFIG_HID_MAGICMOUSE=y"
            echo "CONFIG_IOMMU_DEBUG=y"
            echo "CONFIG_IOMMU_TESTS=y"
            echo "CONFIG_MSDOS_FS=y"
            echo "# CONFIG_NTFS_FS is not set"
            echo "# CONFIG_CRYPTO_LZ4 is not set"
            echo "# CONFIG_DYNAMIC_DEBUG is not set"
            echo "CONFIG_DEBUG_INFO=y"
            echo "# CONFIG_DUMP_ALL_STACKS is not set"
            echo "CONFIG_FRAME_WARN=2048"
            echo ""
            echo "# --- intentionally NOT matched to A13: keep UART console alive for debugging ---"
            echo "CONFIG_SERIAL_MSM_GENI_CONSOLE=y"
          } >> arch/arm64/configs/vendor/gauguin_user_defconfig

      - name: Generate defconfig
        run: |
          cd kernel
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin"
          make O=out ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon gauguin_user_defconfig
          echo "--- 确认下面这几条确实生效了 ---"
          grep -E "CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK|CONFIG_KPM|CONFIG_KALLSYMS_ALL|CONFIG_PANIC_ON_OOPS|CONFIG_RT_GROUP_SCHED|CONFIG_MSM_PERFORMANCE|CONFIG_SERIAL_MSM_GENI_CONSOLE" out/.config

      # KBUILD_BUILD_USER/HOST 这次改成能一眼认出"这是A13-config测试build"
      # 的标识，不是模仿原作者身份——方便你后续跟原版DtHnAme编译产物、
      # 跟手机上现在跑的A13内核三者的版本字符串放在一起区分
      - name: Build kernel Image and gauguin-sm6350.dtb specifically
        run: |
          cd kernel
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin"
          export KBUILD_BUILD_USER=a13test
          export KBUILD_BUILD_HOST=a13test
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            Image 2>&1 | tee build.log
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            vendor/qcom/gauguin-sm6350.dtb 2>&1 | tee -a build.log
          ccache -s

      # KPM需要额外一步：编译出来的Image本身还不带KPM能力，得用SukiSU_patch
      # 仓库里现成的patch_linux工具再处理一遍(这是之前提过的、非GKI上KPM
      # 真实会遇到的额外步骤，不是config层面能替代的)。产出oImage替换原Image
      # 继续走后面打包流程。
      - name: Patch Image for KPM (patch_linux post-build step)
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          cd "$BOOT_OUT"
          curl -sL -o patch_linux \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/kpm/patch_linux"
          chmod +x patch_linux
          ./patch_linux
          if [ -f oImage ]; then
            mv oImage Image
            echo "KPM patch applied, Image替换完成"
          else
            echo "!! oImage没有生成，KPM patch可能失败了，继续用未patch的Image，但manager里KPM大概率不会显示生效"
          fi

      - name: Concatenate Image + dtb manually
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          DTB="$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb"
          if [ -f "$BOOT_OUT/Image" ] && [ -f "$DTB" ]; then
            cat "$BOOT_OUT/Image" "$DTB" > "$BOOT_OUT/Image-dtb"
            echo "拼接完成"
          fi
          find kernel/out/arch/arm64/boot -maxdepth 3 -type f | sort

      - name: Checkout AnyKernel3 template
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/ramdisk ak3/patch ak3/.git

      - name: Write anykernel.sh for gauguin/gauguinpro
        run: |
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script for gauguin/gauguinpro
          ## DtHnAme 11-1源码 + A13-config + ReSukiSU manual-hook

          properties() { '
          kernel.string=gauguin DtHnAme 11-1 A13-config + ReSukiSU + KPM
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          device.name3=gauguininpro
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

      - name: Stage kernel artifacts into AnyKernel3 zip
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          if [ -f "$BOOT_OUT/Image-dtb" ]; then
            cp "$BOOT_OUT/Image-dtb" ak3/Image
          else
            cp "$BOOT_OUT/Image" ak3/Image
            cp "$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb" ak3/dtb 2>/dev/null || true
          fi

      - name: Package AnyKernel3 flashable zip
        run: |
          cd ak3
          zip -r9 ../gauguin-kernel-ReSukiSU-KPM-AK3.zip . -x ".git*"
          cd ..

      - name: Upload AK3 zip + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-kernel-ReSukiSU-KPM-AK3
          path: |
            gauguin-kernel-ReSukiSU-KPM-AK3.zip
            kernel/build.log
          if-no-files-found: warn

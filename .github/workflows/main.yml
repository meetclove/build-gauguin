name: Build Gauguin Kernel (DtHnAme + Extracted Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex libssl-dev bc libncurses-dev \
            build-essential libelf-dev rsync ccache zip unzip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gauguin-dthname-${{ github.run_id }}
          restore-keys: |
            ccache-gauguin-dthname-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache -z

      # 1. 拉取你验证过 100% 能开机的源码库
      - name: Checkout kernel source (DtHnAme, 11-1 branch)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch 11-1 \
            https://github.com/DtHnAme/kernel_xiaomi_gauguin.git kernel

      # 2. 拉取你之前一直使用的 AOSP Clang 11 工具链
      - name: Download AOSP Clang r416183b toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang11

      - name: Download matching AOSP GCC 4.9 toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/gcc49

      # 3. 修复各种编译环境和源码自带的 Bug (包含你之前的修复逻辑)
      - name: Apply essential source fixes
        run: |
          cd kernel
          # 修复 Python 2 语法
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i -e 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' -e "s/print line,/print(line, end='')/" -e "s/print args\[0\] + ':',e.strerror/print(args[0] + ':', e.strerror)/" -e "s/print 'Is your PATH set correctly?'/print('Is your PATH set correctly?')/" -e "s/print ' '.join(args), str(e)/print(' '.join(args), str(e))/" -e '1s/python2/python3/' scripts/gcc-wrapper.py
          fi
          # 修复 Makefile 路径
          sed -i 's|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))|' Makefile
          # 修复 GSI CRC
          if grep -q "if (is_crc) {" scripts/mod/modpost.c; then
            sed -i 's/if (is_crc) {/if (is_crc \&\& strcmp(symname + strlen("__crc_"), "gsi_write_channel_scratch")) {/' scripts/mod/modpost.c
          fi

      - name: Implement stpcpy & Fix duplicate label
        run: |
          cd kernel
          # stpcpy 补丁
          python3 - << 'EOF'
          path = "lib/string.c"
          with open(path) as f: content = f.read()
          if "char *stpcpy" not in content:
              stub = ("char *stpcpy(char *__restrict__ dest, const char *__restrict__ src);\nchar *stpcpy(char *__restrict__ dest, const char *__restrict__ src)\n{\n\twhile ((*dest++ = *src++) != '\\0')\n\t\t;\n\treturn --dest;\n}\nEXPORT_SYMBOL(stpcpy);\n\n")
              content = content.replace("#ifndef __HAVE_ARCH_STRCAT", stub + "#ifndef __HAVE_ARCH_STRCAT", 1)
              with open(path, "w") as f: f.write(content)
          EOF
          # 设备树标签重复修复
          python3 - << 'EOF'
          path = "arch/arm64/boot/dts/vendor/qcom/xiaomi-sm6350-common.dtsi"
          with open(path) as f: content = f.read()
          anchor = "&reserved_memory {\n\tdisp_rdump_memory: disp_rdump_region@ac000000 {"
          if anchor in content and "/delete-node/ &disp_rdump_memory;" not in content:
              content = content.replace(anchor, "/delete-node/ &disp_rdump_memory;\n\n" + anchor, 1)
              with open(path, "w") as f: f.write(content)
          EOF

      # 4. 关键新增：修复由提取配置引起的 qpnp-power-on.c 未定义引用报错
      - name: Fix qpnp-power-on.c linking error
        run: |
          cd kernel
          cat << 'EOF' >> drivers/input/misc/qpnp-power-on.c
          
          /* 修复关闭特定调试选项后导致的未定义引用报错 (弱符号劫持) */
          void __attribute__((weak)) ufs_enter_h8_disable(void) {}
          int __attribute__((weak)) long_press = 0;
          void * __attribute__((weak)) g_shost = 0;
          EOF

      # 5. 精简版本字符串 & 集成 KernelSU (复用你的老流程)
      - name: Simplify string and apply KSU
        run: |
          cd kernel
          sed -i 's|echo \#define LINUX_COMPILER \"`$CC -v 2>&1 | grep '"'"' version '"'"' | sed '"'"'s/[[:space:]]*$$//'"'"'`\"|echo \#define LINUX_COMPILER \"GNU C\"|g' scripts/mkcompile_h
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          for p in ../workflow-repo/patches/*.patch; do patch -p1 < "$p" || true; done

      # 6. 核心动作：注入并生效你提取出的完美 .config
      - name: Inject Custom Extracted .config
        run: |
          cd kernel
          mkdir -p out
          # 复制提取的配置
          cp ../workflow-repo/gauguin_kernel_config.txt out/.config
          
          # 追加 KSU 支持和关闭本地版本号
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_LOCALVERSION_AUTO=n"
          } >> out/.config

          export PATH="$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin:$PATH"
          # 使用 olddefconfig 使新源码兼容此配置文件
          make O=out ARCH=arm64 PYTHON=python3 CC="ccache clang" CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      # 7. 开始编译 (带着 Flyme 的灵魂配置)
      - name: Build kernel Image and dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin:$PATH"
          export KBUILD_BUILD_USER=dthname
          export KBUILD_BUILD_HOST=archlinux
          
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            Image 2>&1 | tee build.log
            
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            vendor/qcom/gauguin-sm6350.dtb 2>&1 | tee -a build.log
          ccache -s

      # 8. 拼接并打包 (复用你的 AK3 脚本)
      - name: Concatenate Image + dtb & Package AK3
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          DTB="$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb"
          if [ -f "$BOOT_OUT/Image" ] && [ -f "$DTB" ]; then
            cat "$BOOT_OUT/Image" "$DTB" > "$BOOT_OUT/Image-dtb"
          fi
          
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/ramdisk ak3/patch ak3/.git
          
          cat > ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=gauguin DtHnAme + A13 Extracted Config
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          
          if [ -f "$BOOT_OUT/Image-dtb" ]; then cp "$BOOT_OUT/Image-dtb" ak3/Image; else cp "$BOOT_OUT/Image" ak3/Image; cp "$DTB" ak3/dtb 2>/dev/null || true; fi
          cd ak3 && zip -r9 ../gauguin-kernel-KSU-AK3.zip . -x ".git*"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-kernel-A13-Config
          path: |
            gauguin-kernel-KSU-AK3.zip
            kernel/build.log

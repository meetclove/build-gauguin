name: Build Gauguin Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex libssl-dev bc libncurses-dev \
            build-essential libelf-dev rsync ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gauguin-dthname-resukisu-clean-${{ github.run_id }}
          restore-keys: |
            ccache-gauguin-dthname-resukisu-clean-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache -z

      - name: Checkout kernel source (DtHnAme, 11-1 branch, confirmed A11 boot)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch master \
            https://github.com/meetclove/kernel_xiaomi_gauguin.git kernel

      - name: Download AOSP Clang r416183b toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang11
          toolchain/clang11/bin/clang --version

      - name: Download matching AOSP GCC 4.9 toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/gcc49

      - name: Fix python2 syntax in scripts/gcc-wrapper.py
        run: |
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i \
              -e 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' \
              -e "s/print line,/print(line, end='')/" \
              -e "s/print args\[0\] + ':',e.strerror/print(args[0] + ':', e.strerror)/" \
              -e "s/print 'Is your PATH set correctly?'/print('Is your PATH set correctly?')/" \
              -e "s/print ' '.join(args), str(e)/print(' '.join(args), str(e))/" \
              -e '1s/python2/python3/' \
              scripts/gcc-wrapper.py
          fi

      - name: Fix GCC_TOOLCHAIN_DIR prefix for Clang cross compilation
        run: |
          cd kernel
          sed -i 's|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$|CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))|' Makefile

      - name: Fix GSI symbol CRC versioning for lld compatibility
        run: |
          cd kernel
          if grep -q "if (is_crc) {" scripts/mod/modpost.c; then
            sed -i 's/if (is_crc) {/if (is_crc \&\& strcmp(symname + strlen("__crc_"), "gsi_write_channel_scratch")) {/' scripts/mod/modpost.c
          fi

      - name: Implement stpcpy for Clang 12 libcall optimization (if missing)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "lib/string.c"
          with open(path) as f:
              content = f.read()
          if "char *stpcpy" in content:
              print("stpcpy已经存在，跳过")
          else:
              stub = ("char *stpcpy(char *__restrict__ dest, const char *__restrict__ src);\n"
                      "char *stpcpy(char *__restrict__ dest, const char *__restrict__ src)\n"
                      "{\n"
                      "\twhile ((*dest++ = *src++) != '\\0')\n"
                      "\t\t/* nothing */;\n"
                      "\treturn --dest;\n"
                      "}\n"
                      "EXPORT_SYMBOL(stpcpy);\n"
                      "\n")
              anchor = "#ifndef __HAVE_ARCH_STRCAT"
              assert anchor in content, "anchor not found, need manual check"
              content = content.replace(anchor, stub + anchor, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("stpcpy inserted")
          EOF

      - name: Fix duplicate disp_rdump_memory label safely in xiaomi-sm6350-common.dtsi
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "arch/arm64/boot/dts/vendor/qcom/xiaomi-sm6350-common.dtsi"
          with open(path) as f:
              content = f.read()
          
          # 直接重命名 label 和 node 避免重复
          anchor = "disp_rdump_memory: disp_rdump_region@ac000000 {"
          if anchor not in content:
              print("未找到原 label，可能已修复或不存在")
          elif "disp_rdump_memory_xiaomi" in content:
              print("已经修过，跳过")
          else:
              content = content.replace(anchor, "disp_rdump_memory_xiaomi: disp_rdump_region_xiaomi@ac000000 {", 1)
              with open(path, "w") as f:
                  f.write(content)
              print("duplicate label 重命名修复完成")
          EOF

      - name: Add ReSukiSU to kernel source tree
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: 4.19 Manual Hook - fs/exec.c (Aligned with SukiSU patch)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/exec.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_execveat_sucompat" in content:
              print("已经打过，跳过"); raise SystemExit(0)

          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern bool ksu_execveat_hook __read_mostly;\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "#endif\n\n")

          anchor1 = "int do_execve(struct filename *filename,\n\tconst char __user *const __user *__argv,\n\tconst char __user *const __user *__envp)\n{\n\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n\tstruct user_arg_ptr envp = { .ptr.native = __envp };"
          hook1 = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                   "\tif (unlikely(ksu_execveat_hook))\n"
                   "\t\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                   "\telse\n"
                   "\t\tksu_handle_execveat_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);\n"
                   "#endif\n")

          anchor2 = "static int compat_do_execve(struct filename *filename,\n\tconst compat_uptr_t __user *__argv,\n\tconst compat_uptr_t __user *__envp)\n{\n\tstruct user_arg_ptr argv = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __argv,\n\t};\n\tstruct user_arg_ptr envp = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __envp,\n\t};"
          hook2 = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                   "\tif (!ksu_execveat_hook)\n"
                   "\t\tksu_handle_execveat_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL); /* 32-bit su */\n"
                   "#endif\n")

          content = content.replace("int do_execve(", decl + "int do_execve(", 1)
          content = content.replace(anchor1, anchor1 + hook1, 1)
          content = content.replace(anchor2, anchor2 + hook2, 1)

          with open(path, "w") as f:
              f.write(content)
          print("fs/exec.c 4.19 hook完成")
          EOF

      - name: 4.19 Manual Hook - fs/read_write.c (Aligned with SukiSU patch)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/read_write.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_sys_read" in content:
              print("已经打过，跳过"); raise SystemExit(0)
              
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n"
                  "#endif\n\n")
          anchor = "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{"
          hook = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                  "#endif\n")
          
          content = content.replace(anchor, decl + anchor + hook, 1)
          with open(path, "w") as f:
              f.write(content)
          print("fs/read_write.c 4.19 hook完成")
          EOF

      - name: 4.19 Manual Hook - drivers/tty/pty.c (Aligned with SukiSU patch)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "drivers/tty/pty.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_devpts" in content:
              print("已经打过，跳过"); raise SystemExit(0)
              
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern int ksu_handle_devpts(struct inode*);\n"
                  "#endif\n\n")
          anchor = "static struct tty_struct *pts_unix98_lookup(struct tty_driver *driver,\n\t\tstruct file *file, int idx)\n{\n\tstruct tty_struct *tty;\n"
          hook = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_devpts((struct inode *)file->f_path.dentry->d_inode);\n"
                  "#endif\n")
          
          content = content.replace(anchor, decl + anchor + hook, 1)
          with open(path, "w") as f:
              f.write(content)
          print("drivers/tty/pty.c 4.19 hook完成")
          EOF

      - name: 4.19 Manual Hook - drivers/input/input.c (Aligned with SukiSU patch)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "drivers/input/input.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_input_handle_event" in content:
              print("已经打过，跳过"); raise SystemExit(0)
              
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern bool ksu_input_hook __read_mostly;\n"
                  "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                  "#endif\n\n")
          anchor = "void input_event(struct input_dev *dev,\n\t\t unsigned int type, unsigned int code, int value)\n{\n\tunsigned long flags;\n"
          hook = ("\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tif (unlikely(ksu_input_hook))\n"
                  "\t\tksu_handle_input_handle_event(&type, &code, &value);\n"
                  "#endif\n")
          
          content = content.replace(anchor, decl + anchor + hook, 1)
          with open(path, "w") as f:
              f.write(content)
          print("drivers/input/input.c 4.19 hook完成")
          EOF

      - name: 4.19 Manual Hook - fs/open.c (Standard)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/open.c"
          with open(path) as f:
              content = f.read()
          if "ksu_handle_faccessat" in content:
              print("已经打过，跳过"); raise SystemExit(0)
          anchor = "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\treturn do_faccessat(dfd, filename, mode);\n}"
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                  "#endif\n\n")
          new = ("SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n"
                 "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"
                 "\treturn do_faccessat(dfd, filename, mode);\n}")
          content = content.replace(anchor, decl + new, 1)
          with open(path, "w") as f:
              f.write(content)
          print("fs/open.c 4.19 hook完成")
          EOF

      - name: 4.19 Manual Hook - fs/stat.c (Standard)
        run: |
          cd kernel
          python3 - << 'EOF'
          path = "fs/stat.c"
          with open(path) as f:
              content = f.read()
          if "CONFIG_KSU_MANUAL_HOOK" in content and "ksu_handle_stat" in content:
              print("已经打过，跳过"); raise SystemExit(0)

          anchor1 = ("#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
                     "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
                     "\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n"
                     "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          decl = ("#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                  "#endif\n\n")
          new1 = anchor1.replace(
              "\tint error;\n\n\terror = vfs_fstatat",
              "\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat"
          )
          content = content.replace(anchor1, decl + new1, 1)

          anchor4 = ("SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
                     "\t\tstruct stat64 __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n"
                     "\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          content = content.replace(anchor4, anchor4.replace(
              "\tint error;\n\n\terror = vfs_fstatat",
              "\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag); /* 32-bit su */\n#endif\n\terror = vfs_fstatat"), 1)

          with open(path, "w") as f:
              f.write(content)
          print("fs/stat.c 4.19 hook完成")
          EOF

      - name: Fix Kernel LOCALVERSION for specific name format
        run: |
          cd kernel
          # 替换原本配置文件里写死的版本后缀，并改为 -perf
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-perf"/g' arch/arm64/configs/vendor/gauguin_user_defconfig
          # 将 CONFIG_LOCALVERSION_AUTO 设为 y
          sed -i 's/# CONFIG_LOCALVERSION_AUTO is not set/CONFIG_LOCALVERSION_AUTO=y/g' arch/arm64/configs/vendor/gauguin_user_defconfig
          # 如果原配置中压根没有相关字段，则在末尾强制补充该配置
          grep -q "CONFIG_LOCALVERSION_AUTO=y" arch/arm64/configs/vendor/gauguin_user_defconfig || echo "CONFIG_LOCALVERSION_AUTO=y" >> arch/arm64/configs/vendor/gauguin_user_defconfig

      - name: Apply ReSukiSU defconfig fragment
        run: |
          cd kernel
          {
            echo "# --- ReSukiSU (manual hook) ---"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"
            echo "# ReSukiSU build要求：不开这个就得手动导出selinuxfs.c里的符号"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> arch/arm64/configs/vendor/gauguin_user_defconfig

      - name: Generate defconfig
        run: |
          cd kernel
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin"
          make O=out ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon gauguin_user_defconfig
          echo "--- 确认下面这几条确实生效了 ---"
          grep -E "CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK|CONFIG_KALLSYMS_ALL|CONFIG_LOCALVERSION" out/.config

      - name: Build kernel Image and gauguin-sm6350.dtb
        run: |
          cd kernel
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchain/clang11/bin:$GITHUB_WORKSPACE/toolchain/gcc49/bin"
          export KBUILD_BUILD_USER=dthname
          export KBUILD_BUILD_HOST=dthname
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            Image 2>&1 | tee build.log
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache $GITHUB_WORKSPACE/toolchain/clang11/bin/clang" \
            CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            vendor/qcom/gauguin-sm6350.dtb 2>&1 | tee -a build.log
          ccache -s

      - name: Concatenate Image + dtb manually
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          DTB="$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb"
          if [ -f "$BOOT_OUT/Image" ] && [ -f "$DTB" ]; then
            cat "$BOOT_OUT/Image" "$DTB" > "$BOOT_OUT/Image-dtb"
            echo "拼接完成"
          fi

      - name: Checkout AnyKernel3 template
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/ramdisk ak3/patch ak3/.git

      - name: Write anykernel.sh for gauguin/gauguinpro
        run: |
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script for gauguin/gauguinpro
          ## DtHnAme 11-1源码 + ReSukiSU 4.19-Aligned hooks

          properties() { '
          kernel.string=gauguin DtHnAme 11-1 ReSukiSU-clean
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          device.name3=gauguininpro
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

      - name: Stage kernel artifacts into AnyKernel3 zip
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          if [ -f "$BOOT_OUT/Image-dtb" ]; then
            cp "$BOOT_OUT/Image-dtb" ak3/Image
          else
            cp "$BOOT_OUT/Image" ak3/Image
            cp "$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb" ak3/dtb 2>/dev/null || true
          fi

      - name: Package AnyKernel3 flashable zip
        run: |
          cd ak3
          zip -r9 ../gauguin-kernel-ReSukiSU-clean-AK3.zip . -x ".git*"
          cd ..

      - name: Upload AK3 zip + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-kernel-ReSukiSU-clean-AK3
          path: |
            gauguin-kernel-ReSukiSU-clean-AK3.zip
            kernel/build.log
          if-no-files-found: warn

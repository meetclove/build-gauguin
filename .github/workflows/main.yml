name: Build Gauguin Kernel (Standard Defconfig)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex libssl-dev bc libncurses-dev \
            build-essential libelf-dev rsync ccache zip unzip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gauguin-standard-${{ github.run_id }}
          restore-keys: |
            ccache-gauguin-standard-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache -z

      # 1. 拉取 AOSPA 官方 Android 13 分支源码
      - name: Checkout AOSPA kernel source
        run: |
          git clone --depth 1 --branch topaz \
            https://github.com/aospa-gauguin/kernel_xiaomi_gauguin.git kernel

      # 2. 拉取 Proton Clang 编译链
      - name: Download Proton Clang 11
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      # 3. 修复 Ubuntu 22.04 默认 Python3 带来的脚本语法报错
      - name: Fix python2 syntax in scripts
        run: |
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i \
              -e 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/' \
              -e "s/print line,/print(line, end='')/" \
              -e "s/print args\[0\] + ':',e.strerror/print(args[0] + ':', e.strerror)/" \
              -e "s/print 'Is your PATH set correctly?'/print('Is your PATH set correctly?')/" \
              -e "s/print ' '.join(args), str(e)/print(' '.join(args), str(e))/" \
              -e '1s/python2/python3/' \
              scripts/gcc-wrapper.py
          fi

      # 4. 修复原源码中存在的设备树标签冲突 (源码本身的 Bug)
      - name: Fix duplicate label in DTSI
        run: |
          cd kernel
          python3 - << 'EOF'
          import os
          path = "arch/arm64/boot/dts/vendor/qcom/xiaomi-sm6350-common.dtsi"
          if os.path.exists(path):
              with open(path) as f:
                  content = f.read()
              anchor = "&reserved_memory {\n\tdisp_rdump_memory: disp_rdump_region@ac000000 {"
              if anchor in content and "/delete-node/ &disp_rdump_memory;" not in content:
                  content = content.replace(anchor, "/delete-node/ &disp_rdump_memory;\n\n" + anchor, 1)
                  with open(path, "w") as f:
                      f.write(content)
                  print("DTSI duplicate label fixed")
          EOF

      # 5. 生成标准配置文件
      - name: Generate Defconfig
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          mkdir -p out
          # 直接使用源码自带的默认配置文件
          make O=out ARCH=arm64 PYTHON=python3 CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- vendor/gauguin_defconfig

      # 6. 开始编译内核
      - name: Build Kernel Image & DTB
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="aospa"
          
          # 编译 Image
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            Image 2>&1 | tee build.log
            
          # 编译 dtb
          make -j$(nproc) O=out \
            ARCH=arm64 PYTHON=python3 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS=-fcommon KCFLAGS="-gdwarf-4 -Wno-error" \
            vendor/qcom/gauguin-sm6350.dtb 2>&1 | tee -a build.log
          ccache -s

      # 7. 手动拼接 Image.gz-dtb (高通平台常见格式)
      - name: Concatenate Image + dtb
        run: |
          BOOT_OUT=kernel/out/arch/arm64/boot
          DTB="$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb"
          if [ -f "$BOOT_OUT/Image" ] && [ -f "$DTB" ]; then
            cat "$BOOT_OUT/Image" "$DTB" > "$BOOT_OUT/Image-dtb"
            echo "拼接完成"
          fi

      # 8. 下载并配置 AnyKernel3 打包工具
      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/patch ak3/ramdisk
          
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script for gauguin
          properties() { '
          kernel.string=AOSPA Standard Kernel for Gauguin
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          supported.versions=
          supported.patchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          
          BOOT_OUT=kernel/out/arch/arm64/boot
          if [ -f "$BOOT_OUT/Image-dtb" ]; then
            cp "$BOOT_OUT/Image-dtb" ak3/Image
          elif [ -f "$BOOT_OUT/Image" ]; then
            cp "$BOOT_OUT/Image" ak3/Image
            cp "$BOOT_OUT/dts/vendor/qcom/gauguin-sm6350.dtb" ak3/dtb 2>/dev/null || true
          fi
          
          cd ak3
          zip -r9 ../gauguin-kernel-standard-AK3.zip . -x ".git*"

      # 9. 上传产物
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-kernel-standard
          path: |
            gauguin-kernel-standard-AK3.zip
            kernel/build.log
          if-no-files-found: warn

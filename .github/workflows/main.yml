name: Build Venus Kernel (Pure)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '使用的 Defconfig 配置文件'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'

jobs:
  build-kernel:
    name: Build Kernel Image
    runs-on: ubuntu-22.04

    steps:
      - name: 准备编译环境 (Setup Build Environment)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: 拉取内核源码 (Clone Kernel Source)
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/meetclove/android_kernel_xiaomi_sm8350.git kernel_workspace

      - name: 拉取 Clang 工具链 (Clone Toolchain)
        # 这里使用高兼容性的 Proton Clang 替代原始的 Clang 11.0.2，
        # 它在编译 5.4 版本内核时速度更快且极少报语法警告错误。
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 编译内核 (Build Kernel)
        working-directory: kernel_workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"

          echo "正在生成配置文件: ${{ github.event.inputs.defconfig }}"
          make O=out CC=clang ${{ github.event.inputs.defconfig }}

          echo "开始多线程编译内核..."
          # 使用 LLVM=1 和 LLVM_IAS=1 启用全栈 LLVM 编译，符合 QGKI 标准
          make -j$(nproc --all) O=out \
                                CC=clang \
                                CROSS_COMPILE=aarch64-linux-gnu- \
                                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                                LLVM=1 LLVM_IAS=1

      - name: 上传编译产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Image-venus-pure
          path: kernel_workspace/out/arch/arm64/boot/Image
          compression-level: 0 # 内核文件本身无需在此阶段过度压缩

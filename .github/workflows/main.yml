name: Build Venus Kernel (Pure)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Select Defconfig Configuration File'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'

jobs:
  build-kernel:
    name: Build Kernel Image
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync squashfs-tools wget zip zlib1g-dev python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/EndCredits/android_kernel_xiaomi_sm8350.git kernel_workspace

      - name: Remove KSU References (Pure Compile Mode)
        working-directory: kernel_workspace
        run: |
          echo "Step 2 - Removing KSU references from kernel source..."
          # Check and remove KSU reference in drivers/Kconfig
          if grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
            echo "Removed KSU reference from Kconfig"
          fi
          # Check and remove KSU reference in drivers/Makefile
          if grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile; then
            sed -i '/obj-\$(CONFIG_KSU)/d' drivers/Makefile
            echo "Removed KSU reference from Makefile"
          fi
          echo "KSU references removal complete"

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        working-directory: kernel_workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Validating defconfig: ${{ github.event.inputs.defconfig }}"
          make O=out CC=clang ${{ github.event.inputs.defconfig }}

          echo "Building kernel with $(nproc --all) cores..."
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1

      - name: Upload Compile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-venus-pure
          path: kernel_workspace/out/arch/arm64/boot/Image
          compression-level: 0

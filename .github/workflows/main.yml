name: Build Venus Kernel (Pure)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '使用的 Defconfig 配置文件'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'

jobs:
  build-kernel:
    name: Build Kernel Image
    runs-on: ubuntu-22.04

    steps:
      - name: 准备编译环境 (Setup Build Environment)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync squashfs-tools wget zip zlib1g-dev python3

      - name: 拉取内核源码 (Clone Kernel Source)
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/EndCredits/android_kernel_xiaomi_sm8350.git kernel_workspace

      - name: 补齐缺失的 KSU 源码 (Satisfy KSU Dependencies)
        working-directory: kernel_workspace
        run: |
          echo "拉取 KernelSU 源码以修复 Kconfig 和底层 hook 缺失报错..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: 拉取 Clang 工具链 (Clone Toolchain)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 编译内核 (Build Kernel)
        working-directory: kernel_workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"

          echo "正在生成配置文件: ${{ github.event.inputs.defconfig }}"
          make O=out CC=clang ${{ github.event.inputs.defconfig }}

          echo "开始多线程编译内核..."
          make -j$(nproc --all) O=out \
                                CC=clang \
                                CROSS_COMPILE=aarch64-linux-gnu- \
                                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                                LLVM=1 LLVM_IAS=1

      - name: 上传编译产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Image-venus-pure
          path: kernel_workspace/out/arch/arm64/boot/Image
          compression-level: 0
